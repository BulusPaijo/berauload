limit_req_zone $binary_remote_addr zone=berauload_login:10m rate=20r/m;
upstream berauload_backend {
    server backend:8000;
    keepalive 24;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /api/auth/login {
        limit_req zone=berauload_login burst=5 nodelay;
        proxy_pass http://berauload_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://berauload_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~* "^/assets/.*-[a-zA-Z0-9_-]{8,}\.(js|css|svg|png|woff2)$" {
        expires 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location = /index.html { add_header Cache-Control 'no-store, max-age=0'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-store, max-age=0'; }
}
